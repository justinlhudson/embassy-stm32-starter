[package]
edition = "2024"
authors = ["Justin L. Hudson <justinlhudson@gmail.com>"]
name = "embassy-stm32-starter"
version = "0.0.2"
license = "MIT OR Apache-2.0"

[lib]
harness = false
test = false
bench = false
doctest = false

[[bin]]
name = "example"
path = "src/bin/example.rs"
test = false
bench = false

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = "1.1.0"
defmt-rtt = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-stm32 = { version = "0.6.0", default-features = false, features = [
  "defmt",
  "time-driver-tim4",
  "exti",
  "rt",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
  "defmt",
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
] }
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
embassy-futures = "0.1"
critical-section = "1.2"
heapless = "0.9.3"
embedded-io = "0.7.1"
num_enum = { version = "0.7", default-features = false }

[[test]]
name = "integration"
harness = false

[[test]]
name = "flash"
harness = false

[dev-dependencies]
semihosting = "0.1.25" # used by HIL tests

[features]
# Default targets the Nucleo-144 (STM32F413ZH). Override on the command line:
#   cargo build --no-default-features --features "hdlc_fcs,stm32f446"
default = ["hdlc_fcs", "stm32f413"]

# Optional HDLC 16-bit FCS (CRC-16) check.
hdlc_fcs = []

# MCU family selection (mutually exclusive — exactly one required).
# Each pulls in the corresponding embassy-stm32 chip feature.
stm32f413 = ["embassy-stm32/stm32f413zh"]
stm32f446 = ["embassy-stm32/stm32f446re"]

# Opt-in destructive HIL flash test.
flash-destructive = []

[profile.dev]
opt-level = 0     # no optimizations
codegen-units = 1 # compile as single unit
debug = true      # full debug info (required for RTT)

[profile.release]
opt-level = 's'   # optimize for size
codegen-units = 1 # compile as single unit
lto = 'fat'       # link time optimizations
debug = false     # no debug (no RTT in release)

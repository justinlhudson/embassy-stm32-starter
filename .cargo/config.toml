[target.'cfg(all(target_arch = "arm", target_os = "none"))']
linker = "arm-none-eabi-ld"
# Default runner targets the default-feature chip (STM32F413ZH).
# For other boards, prefer `./flash.sh` which detects the chip and passes the
# right `--features` and `--chip` automatically.
runner = [
  "probe-rs",
  "run",
  "--chip",
  "STM32F413ZH",
  "--catch-hardfault",
  "--catch-reset",
  "--rtt-scan-memory",
  "--log-format=oneline",
]

rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

[env]
DEFMT_LOG = "trace"

[build]
target = "thumbv7em-none-eabihf"

[alias]
cb    = "clean"
bx    = "build --bin"
start = "run --bin"
tests = "test --test"
